name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Lint
      run: npm run lint
    
    - name: Type check
      run: npm run type-check
    
    - name: Build
      run: npm run build

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./api
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install ruff==0.16.9 black==26.5.1 isort==9.0.2
    
    - name: Lint with ruff
      run: ruff check .
    
    - name: Format check with black
      run: black --check .
    
    - name: Sort imports check
      run: isort --check-only .

  smoke-test:
    runs-on: ubuntu-latest
    needs: [web, api]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Start services
      run: |
        cd infra
        docker compose up -d --build postgres api
    
    - name: Health check
      run: |
        for i in $(seq 1 30); do
          curl -fsS http://localhost:5001/healthz && exit 0
          sleep 5
        done
        docker compose -f infra/docker-compose.yml logs api
        exit 1
